[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Avatar images you haven't added yet: answer 404 (the app shows a placeholder)
# instead of the app's HTML. Files that exist are always served first.
[[redirects]]
  from = "/avatars/*"
  to = "/404"
  status = 404

# Single-page app: send every route (e.g. /join/ABCD) to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Built JS/CSS have content hashes in their names: cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Always check for a new version of the page and manifest.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
